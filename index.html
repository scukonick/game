<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
            color: white;
        }

        #gameContainer {
            text-align: center;
        }

        canvas {
            border: 3px solid #16213e;
            background: #0f3460;
            display: block;
            margin: 20px auto;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        #ui {
            font-size: 20px;
            margin-bottom: 10px;
        }

        #score {
            color: #00ff88;
        }

        #gameOver {
            display: none;
            font-size: 32px;
            color: #ff4757;
            margin-top: 20px;
        }

        button {
            background: #00ff88;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        button:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }

        #gameArea {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
        }

        #sidePanel {
            background: #16213e;
            border: 2px solid #00ff88;
            padding: 20px;
            width: 200px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
        }

        .resource-item {
            margin-bottom: 20px;
        }

        .resource-label {
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .cooldown-bar {
            width: 100%;
            height: 20px;
            background: #0f3460;
            border: 2px solid #00ff88;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .cooldown-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            transition: width 0.05s linear;
        }

        .cooldown-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        .powerup-item {
            background: #0f3460;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            border-left: 3px solid;
        }

        .powerup-rapid { border-left-color: #ff6b9d; }
        .powerup-multi { border-left-color: #00ddff; }
        .powerup-slow { border-left-color: #9d4eff; }

        .powerup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .powerup-name {
            font-size: 12px;
        }

        .powerup-timer {
            font-size: 11px;
            color: #ffdd00;
            font-weight: bold;
        }

        .powerup-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .powerup-bar-fill {
            height: 100%;
            transition: width 0.1s linear;
        }

        .powerup-rapid .powerup-bar-fill { background: #ff6b9d; }
        .powerup-multi .powerup-bar-fill { background: #00ddff; }
        .powerup-slow .powerup-bar-fill { background: #9d4eff; }

        #activePowerups {
            min-height: 20px;
        }

        .no-powerups {
            color: #666;
            font-size: 11px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <span>Score: <span id="score">0</span></span>
            <span style="margin-left: 30px;">High Score: <span id="highScore">0</span></span>
        </div>

        <div id="gameArea">
            <canvas id="gameCanvas" width="800" height="600"></canvas>

            <div id="sidePanel">
                <div class="resource-item">
                    <div class="resource-label">SHOOT READY</div>
                    <div class="cooldown-bar">
                        <div class="cooldown-fill" id="cooldownFill"></div>
                        <div class="cooldown-text" id="cooldownText">READY</div>
                    </div>
                </div>

                <div class="resource-item">
                    <div class="resource-label">ACTIVE POWERS</div>
                    <div id="activePowerups">
                        <div class="no-powerups">None</div>
                    </div>
                </div>

                <div class="resource-item">
                    <div class="resource-label">STATS</div>
                    <div style="font-size: 12px; color: #aaa;">
                        Destroyed: <span id="destroyed" style="color: #fff;">0</span><br>
                        Dodged: <span id="dodged" style="color: #fff;">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="gameOver">
            GAME OVER!
            <br>
            <button onclick="restartGame()">Play Again</button>
        </div>
        <div style="color: #888; font-size: 14px; margin-top: 10px;">
            Use ARROW KEYS or A/D to move | SPACEBAR to shoot
        </div>
        <div style="color: #888; font-size: 12px; margin-top: 5px;">
            Bonuses: ★ Score +20 | ⚡ Rapid Fire | ◆ Triple Shot | ⏱ Slow Motion
        </div>
        <div style="color: #ff6b6b; font-size: 12px; margin-top: 5px;">
            Gray armored obstacles take 3 hits to destroy!
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
